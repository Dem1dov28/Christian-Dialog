services:
  postgresql:
    image: postgres:16-alpine
    container_name: timetalk_postgres
    restart: unless-stopped
    environment:
      # ВАЖНО: эти значения должны приходить из .env файла,
      # который НЕ коммитится в репозиторий
      POSTGRES_DB: ${DB_NAME:-timetalk}
      POSTGRES_USER: ${DB_USER:-timetalk_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_postgresql.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timetalk_user -d timetalk"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - timetalk_network

  # Опционально: pgAdmin для управления БД через веб-интерфейс
  pgadmin:
    # ВАЖНО: запускается только в профиле development.
    # На production-сервере НЕ используйте профиль development, чтобы не поднимать pgAdmin.
    profiles:
      - development
    image: dpage/pgadmin4:latest
    container_name: timetalk_pgadmin
    restart: unless-stopped
    environment:
      # Эти переменные также должны быть заданы в .env,
      # чтобы пароли не хранились в docker-compose.yml
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@timetalk.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - timetalk_network

  # Redis для rate limiting, анти-брутфорса и кэша
  redis:
    image: redis:7-alpine
    container_name: timetalk_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - timetalk_network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  redis_data:
    driver: local

networks:
  timetalk_network:
    driver: bridge

