services:
  postgresql:
    image: postgres:16-alpine
    container_name: timetalk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: timetalk
      POSTGRES_USER: timetalk_user
      POSTGRES_PASSWORD: timetalk_92305FqYic54Op
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_postgresql.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timetalk_user -d timetalk"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - timetalk_network

  # Опционально: pgAdmin для управления БД через веб-интерфейс
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: timetalk_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@timetalk.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - timetalk_network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  timetalk_network:
    driver: bridge

