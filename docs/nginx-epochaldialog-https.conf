# Nginx: HTTPS для epochaldialog.com (фронт + API на одном домене).
# Сертификат: certbot (Let's Encrypt).
#
# Установка на сервере:
#   1. apt install -y nginx
#   2. В docker-compose.yml сменить порт фронта: "8080:80" вместо "80:80"
#   3. Скопировать этот файл: cp docs/nginx-epochaldialog-https.conf /etc/nginx/sites-available/epochaldialog.com
#   4. ln -sf /etc/nginx/sites-available/epochaldialog.com /etc/nginx/sites-enabled/
#   5. Удалить default: rm -f /etc/nginx/sites-enabled/default
#   6. nginx -t && systemctl reload nginx
#
# В .env: VITE_API_BASE_URL=https://epochaldialog.com , ALLOWED_ORIGINS=https://epochaldialog.com

server {
    listen 80;
    server_name epochaldialog.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name epochaldialog.com;

    ssl_certificate     /etc/letsencrypt/live/epochaldialog.com/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/epochaldialog.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Статика фронта (изображения агентов и т.д.)
    location /images/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API (FastAPI) — все пути бэкенда
    # ВАЖНО: chat/ (со слешом) — чтобы SPA-маршрут /chat шёл на фронтенд,
    # а API-эндпоинты /chat/new, /chat/send и т.д. — на бэкенд.
    # webhook — для Telegram Bot (Stars-оплата), должен идти на бэкенд
    location ~ ^/(auth|agents|conversations|chat/|multi-agent-chat|folders|search|static|api|docs|openapi|health|reports|support|payments|pinned-chats|attractions|attraction-visits|uploads|exports|users|messages|webhook) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Статические файлы фронтенда (JS, CSS, assets)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|webp|json|html)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Все остальные пути — отдаем index.html для SPA роутинга
    location / {
        proxy_pass http://127.0.0.1:8080/index.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
