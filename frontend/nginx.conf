# SPA + API reverse proxy: single entry point
# Nginx serves the frontend SPA and proxies backend API routes to FastAPI.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # --- OAuth callbacks: SPA routes (React Router), NOT backend ---
    location ~ ^/auth/(google|telegram)-callback {
        try_files $uri $uri/ /index.html;
    }

    # --- Backend API proxy ---
    # All known backend route prefixes are proxied to FastAPI.
    location ~ ^/(auth|search|payments|agents|chat/|conversations|multi-agent-chat|folders|pinned-chats|attractions|attraction-visits|api|static|users|messages|health|test-|docs|openapi\.json|redoc) {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # WebSocket support (if needed in the future)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }

    # --- Static asset caching ---
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|webp|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA fallback ---
    # Any route not matched above serves index.html (React Router handles it).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
