<!doctype html>
<html lang="en">
  <head>
    <!-- Theme initialization script - MUST be first to prevent FOUC -->
    <script>
      (function () {
        try {
          const stored =
            localStorage.getItem("theme") ||
            sessionStorage.getItem("theme") ||
            "dark";

          // Нормализуем старое значение "violet" к новой тёмной теме
          let theme = stored === "violet" ? "dark" : stored;
          if (!["light", "dark", "blue", "pastel"].includes(theme)) {
            theme = "dark";
          }

          if (stored !== theme) {
            try {
              localStorage.setItem("theme", theme);
            } catch (_) {}
          }

          const isDarkLike = theme === "dark" || theme === "blue";
          if (isDarkLike) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }

          if (theme === "blue") {
            document.documentElement.classList.add("theme-blue");
          } else {
            document.documentElement.classList.remove("theme-blue");
          }

          if (theme === "pastel") {
            document.documentElement.classList.add("theme-pastel");
          } else {
            document.documentElement.classList.remove("theme-pastel");
          }
        } catch (e) {
          // Fallback to тёмной теме
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <!-- Viewport height fix for mobile browsers.
         window.visualViewport.height даёт реальную видимую высоту:
         исключает адресную строку браузера, системную навигацию Android и клавиатуру.
         Без этого 100dvh/100vh на мобильных браузерах больше видимой области
         и нижняя часть приложения обрезается. -->
    <script>
      (function() {
        function setViewportHeight() {
          // visualViewport точнее innerHeight на мобильных: учитывает системные панели
          var height = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
          document.documentElement.style.setProperty('--vh', (height * 0.01) + 'px');
        }
        setViewportHeight();
        window.addEventListener('resize', setViewportHeight);
        window.addEventListener('orientationchange', setViewportHeight);
        // visualViewport resize срабатывает при появлении клавиатуры на мобильных
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', setViewportHeight);
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
