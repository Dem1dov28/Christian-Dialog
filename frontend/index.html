  <!-- Mixed Content: при открытии из Telegram по HTTP — сразу HTTPS (до любых скриптов) -->
  <script>
    (function(){try{var l=window.location;if(l.protocol!=="https:"&&l.hostname==="epochaldialog.com"&&document.referrer&&document.referrer.indexOf("telegram.org")>=0){l.replace("https:"+l.href.slice(l.protocol.length));}}catch(_){}})();
  </script>
  <!-- Charset MUST be within first 1024 bytes for security -->
  <meta charset="UTF-8" />

  <!-- Theme initialization script - MUST be early to prevent FOUC -->
  <script>
    (function () {
      try {
        const stored =
          localStorage.getItem("theme") ||
          sessionStorage.getItem("theme") ||
          "dark";

        // Нормализуем старое значение "violet" к новой тёмной теме
        let theme = stored === "violet" ? "dark" : stored;
        if (!["light", "dark", "blue", "pastel"].includes(theme)) {
          theme = "dark";
        }

        if (stored !== theme) {
          try {
            localStorage.setItem("theme", theme);
          } catch (_) { }
        }

        const isDarkLike = theme === "dark" || theme === "blue";
        if (isDarkLike) {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }

        if (theme === "blue") {
          document.documentElement.classList.add("theme-blue");
        } else {
          document.documentElement.classList.remove("theme-blue");
        }

        if (theme === "pastel") {
          document.documentElement.classList.add("theme-pastel");
        } else {
          document.documentElement.classList.remove("theme-pastel");
        }
      } catch (e) {
        // Fallback to тёмной теме
        document.documentElement.classList.add("dark");
      }
    })();
  </script>

  <!-- Viewport height fix for mobile browsers.
         100svh (CSS) — основной способ, но не поддерживается в Chrome < 108 (Android).
         --app-height через visualViewport.height — JS-фолбек: даёт реальную видимую высоту
         на всех устройствах, применяется последним и переопределяет CSS-значения. -->
  <script>
    (function () {
      function setViewportHeight() {
        // window.innerHeight стабилен — не меняется при открытии клавиатуры.
        // visualViewport.height использовать нельзя: он уменьшается при открытии
        // клавиатуры и вызывает прыжок всего layout вверх.
        var height = window.innerHeight;
        document.documentElement.style.setProperty('--app-height', height + 'px');
        document.documentElement.style.setProperty('--vh', (height * 0.01) + 'px');
      }
      setViewportHeight();
      window.addEventListener('resize', setViewportHeight);
      window.addEventListener('orientationchange', function () {
        setTimeout(setViewportHeight, 150);
      });
      // Блокируем pinch-to-zoom жестами на iOS (user-scalable=no игнорируется с iOS 10)
      // Не блокируем в полях ввода — иначе нельзя вводить текст
      function isEditable(el) {
        var t = el && el.tagName ? el.tagName.toUpperCase() : '';
        return t === 'INPUT' || t === 'TEXTAREA' || (el && el.isContentEditable);
      }
      function blockGesture(e) {
        if (isEditable(e.target)) return;
        e.preventDefault();
      }
      document.addEventListener('gesturestart', blockGesture, { passive: false });
      document.addEventListener('gesturechange', blockGesture, { passive: false });
      document.addEventListener('gestureend', blockGesture, { passive: false });
    })();
  </script>

  <!-- Critical CSS - inlined for fast initial render -->
  <style>
    /**
       * Critical CSS - Inline styles for fast initial render
       * These styles are loaded inline in index.html to prevent FOUC
       */

    /* Critical layout styles */
    html {
      scroll-behavior: smooth;
    }

    /* Prevent FOUC during theme initialization */
    html.dark {
      background-color: #2d283e;
      color: rgba(209, 215, 224, 0.98);
    }

    html:not(.dark) {
      background-color: #ffffff;
      color: #1f2937;
    }

    /* Critical body styles */
    body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      min-height: var(--app-height, 100dvh);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Loading state - prevent layout shift */
    #root {
      min-height: 100dvh;
      min-height: var(--app-height, 100dvh);
    }

    /* Critical font-family fallback to prevent FOUT */
    .font-sans {
      font-family: 'Roboto', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* Prevent text selection during load */
    .loading * {
      user-select: none;
    }

    /* Inputs must always be editable (Telegram WebView) */
    input,
    textarea,
    [contenteditable="true"] {
      -webkit-user-select: text !important;
      user-select: text !important;
    }

    /* Critical viewport height fix */
    :root {
      --vh: 1vh;
    }

    /* App container critical styles */
    .app-container {
      display: flex;
      height: 100dvh;
      height: var(--app-height, 100dvh);
      width: 100%;
      overflow: hidden;
    }

    /* Critical utility classes */
    .flex {
      display: flex;
    }

    .h-full {
      height: 100%;
    }

    .w-full {
      width: 100%;
    }

    .overflow-hidden {
      overflow: hidden;
    }

    /* Auth background fallback */
    .auth-bg {
      background-color: #2d283e;
      background-image: linear-gradient(135deg, #2d283e 0%, #564f6f 50%, #2d283e 100%);
    }

    /* Reduced motion preference */
    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
