<!doctype html>

    <!-- Charset MUST be within first 1024 bytes for security -->
    <meta charset="UTF-8" />
    
    <!-- Theme initialization script - MUST be early to prevent FOUC -->
    <script>
      (function () {
        try {
          const stored =
            localStorage.getItem("theme") ||
            sessionStorage.getItem("theme") ||
            "dark";

          // Нормализуем старое значение "violet" к новой тёмной теме
          let theme = stored === "violet" ? "dark" : stored;
          if (!["light", "dark", "blue", "pastel"].includes(theme)) {
            theme = "dark";
          }

          if (stored !== theme) {
            try {
              localStorage.setItem("theme", theme);
            } catch (_) {}
          }

          const isDarkLike = theme === "dark" || theme === "blue";
          if (isDarkLike) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }

          if (theme === "blue") {
            document.documentElement.classList.add("theme-blue");
          } else {
            document.documentElement.classList.remove("theme-blue");
          }

          if (theme === "pastel") {
            document.documentElement.classList.add("theme-pastel");
          } else {
            document.documentElement.classList.remove("theme-pastel");
          }
        } catch (e) {
          // Fallback to тёмной теме
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    
    <!-- Viewport height fix for mobile browsers.
         100svh (CSS) — основной способ, но не поддерживается в Chrome < 108 (Android).
         --app-height через visualViewport.height — JS-фолбек: даёт реальную видимую высоту
         на всех устройствах, применяется последним и переопределяет CSS-значения. -->
    <script>
      (function() {
        function setViewportHeight() {
          var height = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
          var px = height + 'px';
          document.documentElement.style.setProperty('--app-height', px);
          document.documentElement.style.setProperty('--vh', (height * 0.01) + 'px');
        }
        setViewportHeight();
        window.addEventListener('resize', setViewportHeight);
        window.addEventListener('orientationchange', setViewportHeight);
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', setViewportHeight);
        }
      })();
    </script>
