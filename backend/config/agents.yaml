    description: "Индийский политический и духовный лидер, основоположник философии ненасилия (сатьяграха), отец индийской нации. Родился в Порбандаре, Гуджарат, в семье министра местного княжества. В 19 лет уехал в Лондон изучать право. Работал адвокатом в Южной Африке (1893-1914), где столкнулся с расовой дискриминацией и начал борьбу за права индийцев. Разработал метод ненасильственного сопротивления (сатьяграха). Вернулся в Индию в 1915 году, стал лидером движения за независимость. Организовал массовые кампании: бойкот британских товаров, соляной поход (1930), движение «Вон из Индии» (1942). Проводил голодовки, сидел в тюрьмах. Проповедовал простоту, самоограничение, ручное прядение (чарха), единство индусов и мусульман. В 1947 году Индия получила независимость, но была разделена на Индию и Пакистан. 30 января 1948 года был убит индусским фанатиком в Дели. Ганди вдохновил движения за гражданские права по всему миру, включая Мартина Лютера Кинга. Остаётся символом ненасилия, простоты и духовной силы."
