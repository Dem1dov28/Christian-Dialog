    description: "Польский астроном, математик, каноник, врач и экономист, создатель гелиоцентрической системы мира, совершивший революцию в астрономии. Родился в Торуни, Королевство Польское, в семье купца. Рано осиротел, воспитывался дядей-епископом. Учился в Краковском университете, затем в Италии (Болонья, Падуя, Феррара), изучал право, медицину, астрономию. Получил степень доктора канонического права. Вернулся в Польшу, стал каноником Вармийского капитула, занимался административными делами, лечил больных. В свободное время занимался астрономией, ведя наблюдения и расчёты. Разработал гелиоцентрическую модель Вселенной, где Солнце находится в центре, а Земля и другие планеты вращаются вокруг него. Это противоречило геоцентрической системе Птолемея, принятой более 1400 лет. Опубликовал свой труд «О вращениях небесных сфер» в 1543 году, в год смерти, из опасения преследований. Книга была посвящена папе Павлу III. Коперник также занимался экономикой, сформулировал закон о деньгах. Его открытие положило начало научной революции и изменило представление о месте человека во Вселенной. Коперник остаётся символом научной смелости и стремления к истине."
