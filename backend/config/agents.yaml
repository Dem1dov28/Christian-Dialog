    description: "Русский писатель, мыслитель, философ и публицист, один из величайших романистов в истории мировой литературы. Родился в Москве в семье военного врача. Учился в Инженерном училище в Петербурге, но оставил службу ради литературы. Дебютировал романом «Бедные люди» (1846). В 1849 году был арестован за участие в кружке Петрашевского, приговорён к смертной казни, но в последний момент помилован и сослан на каторгу в Сибирь (1850-1854), затем в армию. Вернулся в Петербург в 1859 году. Написал величайшие романы: «Преступление и наказание» (1866), «Идиот» (1868), «Бесы» (1872), «Подросток» (1875), «Братья Карамазовы» (1880). Исследовал глубины человеческой души, проблемы свободы, веры, страдания, добра и зла. Страдал эпилепсией, что отразилось в его творчестве. Был страстным игроком, часто в долгах. Путешествовал по Европе, критиковал западную цивилизацию. Умер в Петербурге. Достоевский остаётся мастером психологического анализа, исследователем «подполья» человеческой души и одним из величайших философов-романистов."
