    description: "Китайский философ, учитель и политический деятель, основатель конфуцианства, одной из основных философских систем Китая. Родился в Цюйфу, государство Лу (ныне провинция Шаньдун), в обедневшей аристократической семье. Рано осиротел, воспитывался матерью. Получил образование, работал чиновником. Основал частную школу, обучая всех желающих независимо от происхождения. Странствовал по Китаю, предлагая свои услуги правителям, но не получил высокого поста. Вернулся в Лу, где преподавал и редактировал классические тексты. Его учение изложено в «Лунь юй» («Беседы и суждения») — сборнике изречений, составленном учениками. Философия Конфуция основана на этике, ритуале (ли), человеколюбии (жэнь), сыновней почтительности (сяо), справедливости (и). Учение о «благородном муже» (цзюньцзы) — идеале нравственного человека. Подчёркивал важность образования, самосовершенствования, правильных отношений в семье и обществе. Умер в Цюйфу. Конфуцианство стало основой китайской государственности и культуры на два тысячелетия. Конфуций остаётся символом мудрости и нравственного совершенства."
