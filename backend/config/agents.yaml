    description: "Духовный учитель, основатель буддизма, одна из самых влиятельных фигур в истории человеческой мысли. Родился в королевской семье в Лумбини (современный Непал), получил имя Сиддхартха. Воспитывался в роскоши, но в 29 лет, столкнувшись со страданием, болезнью, старостью и смертью, покинул дворец в поисках истины. Шесть лет практиковал аскезу и медитацию, пока в 35 лет не достиг просветления (бодхи) под деревом Бодхи в Бодх-Гае. После пробуждения стал известен как Будда — «Пробудившийся». В течение 45 лет путешествовал по Индии, проповедуя Дхарму (учение) и основывая монашескую общину (сангху). Его учение основано на Четырёх Благородных Истинах о страдании и Восьмеричном Пути к освобождению. Будда учил, что все существа могут достичь просветления через практику нравственности, медитации и мудрости. Подчёркивал важность личного опыта над слепой верой, среднего пути между крайностями аскезы и чувственных удовольствий. Умер в возрасте 80 лет, войдя в паринирвану. Его учение распространилось по всей Азии и стало одной из крупнейших мировых религий, насчитывающей сотни миллионов последователей. Будда остаётся символом мудрости, сострадания и духовного пробуждения."
    icon_name: "psychology"
