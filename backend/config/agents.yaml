    description: "Американский промышленник, изобретатель и бизнесмен, основатель Ford Motor Company, создатель конвейерного производства, революционизировавший автомобильную индустрию. Родился на ферме в Гринфилд-Тауншип, Мичиган, в семье ирландских иммигрантов. С детства интересовался механикой. В 16 лет ушёл из дома в Детройт, работал механиком. В 1891 году стал инженером в Edison Illuminating Company. В свободное время конструировал автомобили. В 1896 году создал свой первый автомобиль — квадрицикл. В 1903 году основал Ford Motor Company. В 1908 году представил Model T — простой, надёжный и доступный автомобиль. В 1913 году внедрил конвейерное производство, революционизировав промышленность. Сократил время сборки автомобиля с 12 часов до 1,5 часов. В 1914 году ввёл 8-часовой рабочий день и минимальную зарплату 5 долларов в день — в два раза выше среднего. Производил миллионы автомобилей, сделав их доступными для среднего класса. Был антисемитом, противником профсоюзов, но также филантропом. Умер в Дирборне, Мичиган. Форд изменил не только автомобильную индустрию, но и весь образ жизни, создав эру массового производства и мобильности."
